<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self' data:;" />
  <title>Exam Access — Lumina AI</title>
  <link rel="stylesheet" href="../../assets/components.css" />
  <link rel="stylesheet" href="../../assets/step-progress.css" />
  <link rel="stylesheet" href="exam-code.css" />
</head>
<body class="exam-page">
  <div class="page-background">
    <div class="exam-card">

      <!-- Lock icon -->
      <div class="icon-container" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"
             xmlns="http://www.w3.org/2000/svg">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2
                   2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6
                   9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6
                   c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
      </div>

      <!-- Wordmark + Headline -->
      <p class="wordmark">Lumina AI</p>
      <h1 class="headline">Secure Exam Access</h1>
      <p class="subtitle">Enter your exam code to begin your secure session</p>

      <!-- Student identity bar -->
      <div class="student-bar">
        <span class="student-name" id="studentName">Loading…</span>
        <button type="button" class="logout-btn" id="logoutBtn">Log out</button>
      </div>

      <!-- Exam code form -->
      <form id="examForm" novalidate>
        <div class="input-group">
          <label for="examCode">EXAM CODE</label>
          <div class="code-field-wrapper">
            <input
              type="text"
              id="examCode"
              name="examCode"
              class="code-field"
              maxlength="8"
              inputmode="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="E.G. EXAM-CODE"
              aria-describedby="errorMessage"
            />
            <span class="code-field-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"
                   xmlns="http://www.w3.org/2000/svg">
                <path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69
                         6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7
                         14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
              </svg>
            </span>
          </div>
          <p class="error-message" id="errorMessage" role="alert" aria-live="polite"></p>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary">
          <span id="btnText">JOIN EXAM</span>
          <svg id="btnArrow" width="18" height="18" viewBox="0 0 24 24"
               fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
          </svg>
          <span id="btnSpinner" class="btn-spinner btn-spinner--hidden" aria-hidden="true"></span>
        </button>
      </form>

      <!-- Status chips -->
      <div class="chips" aria-label="Security features">
        <span class="chip">🔒 ENCRYPTED FEED</span>
        <span class="chip">👁 AI MONITORING</span>
      </div>

      <!-- Footer -->
      <p class="footer-text">
        Having trouble? <a href="#" id="helpLink">Contact support</a>
      </p>

    </div>
  </div>

  <!-- Step progress — step 2 of 5 -->
  <nav class="step-progress"
       role="progressbar"
       aria-label="Step 2 of 5: Exam Code"
       aria-valuenow="2"
       aria-valuemin="1"
       aria-valuemax="5">
    <span class="step-pill step-pill--done"  title="Step 1: Login"></span>
    <span class="step-pill step-pill--active" title="Step 2: Exam Code"></span>
    <span class="step-pill" title="Step 3: Identity Verification"></span>
    <span class="step-pill" title="Step 4: AI Readiness"></span>
    <span class="step-pill" title="Step 5: Exam Instructions"></span>
  </nav>

  <script src="exam-code.js" defer></script>
</body>
</html>
