<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self'; script-src 'self'; font-src 'self' data:;" />
  <title>Login — Lumina AI</title>
  <link rel="stylesheet" href="../../assets/components.css" />
  <link rel="stylesheet" href="../../assets/step-progress.css" />
  <link rel="stylesheet" href="./login.css" />
</head>

<body class="login-page">

  <!-- =====================================================================
       Navigation Bar
       ===================================================================== -->
  <nav class="login-nav" role="navigation" aria-label="Application navigation">
    <span class="login-nav__wordmark">Lumina</span>
    <div class="login-nav__actions">
      <span class="login-nav__label" aria-hidden="true">Login</span>
      <!-- <button class="icon-btn" type="button" aria-label="Help">?</button>
      <button class="icon-btn" id="nav-info-btn" type="button" aria-label="Information">ⓘ</button> -->
    </div>
  </nav>

  <!-- =====================================================================
       Main Content — Login Card
       ===================================================================== -->
  <main class="login-main" role="main">

    <div class="login-card" role="region" aria-label="Student login">

      <!-- Shield icon -->
      <div class="login-card__icon" aria-hidden="true">
        <!-- Material Shield with checkmark -->
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="currentColor"
          aria-hidden="true" focusable="false">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12
                   5.16-1.26 9-6.45 9-12V5l-9-4z
                   m-1 14l-3-3 1.41-1.41L11 12.17l5.59-5.58L18 8l-7 7z" />
        </svg>
      </div>

      <!-- Headline -->
      <h1 class="login-card__headline">Welcome Back</h1>
      <p class="login-card__subtitle">The Digital Sanctuary of Integrity</p>

      <!-- Login Form -->
      <form class="login-form" id="login-form" novalidate autocomplete="off">

        <!-- Email Address -->
        <div class="form-field">
          <label class="form-label" for="email-input">Email Address</label>
          <input class="input-field" type="email" id="email-input" name="email" placeholder="name@institution.edu"
            autocomplete="username" spellcheck="false" required />
        </div>

        <!-- Password + Forgot Password link -->
        <div class="form-field">
          <div class="form-label-row">
            <label class="form-label" for="password-input">Password</label>
            <a class="forgot-link" id="forgot-link" href="#" role="button"
              aria-label="Forgot password — opens external link">Forgot password?</a>
          </div>
          <div class="password-wrapper">
            <input class="input-field" type="password" id="password-input" name="password" placeholder="••••••••"
              autocomplete="current-password" required />
            <button class="password-toggle" type="button" id="password-toggle" aria-label="Show password" tabindex="-1">
              <!-- Eye open (shown when password is hidden) -->
              <svg id="icon-eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true" focusable="false">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <!-- Eye off (shown when password is visible) -->
              <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true" focusable="false" class="pw-icon--hidden">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8
                         a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4
                         c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07
                         a3 3 0 1 1-4.24-4.24" />
                <line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Inline error message (empty by default, populated by login.js) -->
        <p class="form-error" id="login-error" role="alert" aria-live="polite"></p>

        <!-- Remember this device -->
        <label class="remember-label">
          <input type="checkbox" id="remember-checkbox" />
          Remember this device
        </label>

        <!-- Submit button -->
        <button class="btn btn-primary login-btn" id="login-btn" type="submit">
          <span id="login-btn-text">LOGIN →</span>
          <span class="spinner" id="login-spinner" hidden aria-hidden="true"></span>
        </button>

      </form>

      <!-- Card footer: divider + access policy note -->
      <div class="login-card__divider" aria-hidden="true"></div>
      <p class="login-card__access-note">
        Authorized Personnel Only.
        <a id="access-policy-link" href="#">System Access Policy</a>
      </p>

    </div><!-- /login-card -->

    <!-- Step progress — step 1 of 5 (Login → Exam Code → Identity → AI Readiness → Instructions) -->
    <nav class="step-progress"
         role="progressbar"
         aria-label="Step 1 of 5: Login"
         aria-valuenow="1"
         aria-valuemin="1"
         aria-valuemax="5">
      <span class="step-pill step-pill--active" title="Step 1: Login"></span>
      <span class="step-pill" title="Step 2: Exam Code"></span>
      <span class="step-pill" title="Step 3: Identity Verification"></span>
      <span class="step-pill" title="Step 4: AI Readiness"></span>
      <span class="step-pill" title="Step 5: Exam Instructions"></span>
    </nav>

  </main>


  <!-- =====================================================================
       Footer
       ===================================================================== -->
  <footer class="login-footer" role="contentinfo">
    <span>© 2026 Lumina AI Proctoring System. The Digital Sanctuary.</span>
    <nav class="login-footer__links" aria-label="Legal and support links">
      <a id="privacy-link" href="#">Privacy Policy</a>
      <a id="terms-link" href="#">Terms of Service</a>
      <a id="system-check-link" href="#">System Check</a>
    </nav>
  </footer>

  <script type="module" src="./login.js"></script>
</body>

</html>
